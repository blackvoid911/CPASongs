name: Build Android & iOS (KMP)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  # ============ ANDROID BUILD ============
  build-android:
    name: Build Android (KMP)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :shared:testAndroidHostTest --no-daemon --stacktrace
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      
      - name: Build signed release AAB
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release signing is unconfigured. Skipping the release bundle."
            exit 0
          fi
          : "${ANDROID_RELEASE_STORE_PASSWORD:?Missing release store password}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?Missing release key alias}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?Missing release key password}"
          umask 077
          export ANDROID_RELEASE_KEYSTORE="$(mktemp "$RUNNER_TEMP/cpasongs-release-XXXXXX")"
          trap 'rm -f "$ANDROID_RELEASE_KEYSTORE"' EXIT
          printf "%s" "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "^jar verified\.$"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Release AAB
        if: steps.release.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

  # ============ iOS BUILD ============
  build-ios:
    name: Build iOS (KMP)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Verify macOS environment
        run: |
          echo "Running on macOS: $(sw_vers -productVersion)"
          echo "Xcode version: $(xcodebuild -version | head -n 1)"
          echo "Available simulators:"
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -5
      
      - name: Build KMP Shared Framework (iOS Simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      
      - name: Verify Framework Built
        run: |
          FRAMEWORK_PATH="shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework"
          if [ -d "$FRAMEWORK_PATH" ]; then
            echo "✅ KMP framework built successfully"
            ls -lh "$FRAMEWORK_PATH"
            echo "Framework structure:"
            ls -R "$FRAMEWORK_PATH"
          else
            echo "❌ Framework not found at $FRAMEWORK_PATH"
            exit 1
          fi
      
      - name: Build iOS App (Simulator)
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            build
      
      - name: Verify iOS Build Output
        run: |
          if [ -d "iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app" ]; then
            echo "✅ iOS app built successfully"
            ls -lh iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
          else
            echo "❌ iOS app not found"
            exit 1
          fi
      
      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-app
          path: iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
          retention-days: 14

  # ============ iOS DEVICE BUILD (Release) ============
  build-ios-device:
    name: Build iOS Device (KMP)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build KMP Shared Framework (iOS Device)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace
      
      - name: Verify Framework Built
        run: |
          FRAMEWORK_PATH="shared/build/bin/iosArm64/releaseFramework/shared.framework"
          if [ -d "$FRAMEWORK_PATH" ]; then
            echo "✅ KMP release framework built successfully"
            ls -lh "$FRAMEWORK_PATH"
          else
            echo "❌ Framework not found"
            exit 1
          fi
      
      - name: Build iOS App (Device - unsigned)
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Create IPA (if needed for distribution)
        run: |
          cd iosApp/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r iosApp.app Payload/
          zip -r ../iosApp-unsigned.ipa Payload/
          echo "✅ Unsigned IPA created for testing"
      
      - name: Upload iOS Device Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-device-unsigned
          path: iosApp/build/Build/Products/iosApp-unsigned.ipa
          retention-days: 30

  # ============ GRADLE VERIFICATION ============
  verify-gradle:
    name: Verify Gradle Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Gradle Version
        run: ./gradlew --version
      
      - name: List All Tasks
        run: ./gradlew tasks --no-daemon
      
      - name: Check Dependencies
        run: ./gradlew :shared:dependencies --configuration androidCompileClasspath --no-daemon | head -100

  # ============ BUILD SUMMARY ============
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android  | ${{ needs.build-android.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS      | ${{ needs.build-ios.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Android Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "- Android Release AAB (if keystore available)" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Simulator App" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Device Build (main branch only)" >> $GITHUB_STEP_SUMMARY

